<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="tiktok-developers-site-verification" content="vm7lEgYecTQJj0EEIC7EGd0tAgx1hyGO">
  <title>OAuth Callback — Digital Bookshelf</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 0 auto; padding: 48px 24px; line-height: 1.7; color: #2d1b4e; background: #fafafa; }
    h1 { color: #1a0f2e; }
    code { background: #f0f0f0; padding: 8px 12px; border-radius: 6px; display: block; margin: 16px 0; word-break: break-all; font-size: 13px; }
    .ok { color: #2d7a2d; font-weight: 600; }
    .err { color: #b91c1c; font-weight: 600; }
    .step { background: white; padding: 16px; border-radius: 8px; margin: 16px 0; border: 1px solid #e0e0e0; }
    button { background: #d4af37; color: #1a0f2e; border: 0; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📚 OAuth Callback Received</h1>

  <div id="result"></div>

  <div class="step">
    <h2>Next step</h2>
    <p>Copy the full URL of this page from your address bar and paste it back into the terminal where <code>authorize_tiktok.py</code> is running.</p>
    <button onclick="copyURL()">📋 Copy this URL</button>
    <p id="copy-status"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDescription = params.get('error_description');

    const result = document.getElementById('result');

    if (error) {
      result.innerHTML = `
        <p class="err">❌ Authorization failed</p>
        <p>Error: <code>${error}</code></p>
        ${errorDescription ? `<p>Details: <code>${errorDescription}</code></p>` : ''}
        <p>You can close this tab and re-run the authorize script.</p>
      `;
    } else if (code) {
      result.innerHTML = `
        <p class="ok">✅ Authorization successful</p>
        <p>code: <code>${code.substring(0, 40)}...</code></p>
        <p>state: <code>${state}</code></p>
        <p>The terminal script is waiting for this URL.</p>
      `;
    } else {
      result.innerHTML = `
        <p class="err">⚠️ No code or error parameter found</p>
        <p>This page should be reached by clicking "Authorize" on TikTok's consent screen.</p>
      `;
    }

    function copyURL() {
      navigator.clipboard.writeText(window.location.href)
        .then(() => { document.getElementById('copy-status').innerHTML = '✅ URL copied — paste it into the terminal'; })
        .catch(err => { document.getElementById('copy-status').innerHTML = '❌ Copy failed: ' + err.message + '<br>Please copy manually from the address bar.'; });
    }
  </script>
</body>
</html>
